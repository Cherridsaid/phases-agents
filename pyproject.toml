[project]
name = "phases-agents"
version = "0.5.0"
description = "MCP local de découverte et sélection déterministe de skills validés."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "S. Cherrid" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "agent-skills",
    "audit",
    "compliance",
    "deterministic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Source = "https://github.com/Cherridsaid/phases-agents"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
