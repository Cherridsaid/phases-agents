[project]
name = "phases-agents"
version = "0.5.0"
description = "MCP local de découverte et sélection déterministe de skills validés."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "S. Cherrid" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "agent-skills",
    "audit",
    "compliance",
    "deterministic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
phases-agents = "phases_agents.server:main"

[project.urls]
Source = "https://github.com/Cherridsaid/phases-agents"

# setuptools >= 77 : premier support stable de `license` en chaine SPDX et de
# `license-files` (PEP 639). Sans build-system declare, pip retombe sur un
# setuptools legacy qui ne sait pas construire ces metadonnees.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Layout src, un seul paquet. La distribution plate precedente installait
# `server.py`, `registry.py`, `validator.py` et les dossiers `core/` et
# `registry/` a la racine de site-packages : des noms trop generiques pour
# cohabiter avec d'autres paquets dans le meme environnement.
#
# `core/` et `registry/` restent des DONNEES resolues relativement a
# validator.py, donc a cote des modules, maintenant a l'interieur du paquet.
# Le module `registry.py` et le dossier `registry/` coexistent toujours :
# un module regulier prime sur une portion de namespace a l'import, ce que
# la sonde de tests/wheel_check.py verifie sur la wheel installee.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["phases_agents"]

[tool.setuptools.package-data]
phases_agents = ["core/*.json", "core/*.md", "registry/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
